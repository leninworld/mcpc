name: Validate terminal coloring after upstream merge
on:
  push:
    branches: [validate-terminal-colors-468-merge-20261106-a2]
permissions:
  contents: read
  actions: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Actual creation-time anchor
        id: anchor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/leninworld/mcpc/actions/runs/$GITHUB_RUN_ID > "$RUNNER_TEMP/run.json"
          gh api repos/leninworld/mcpc/actions/runs/42325805410 > "$RUNNER_TEMP/first-run.json"
          python3 - <<'PY'
          import json,os,datetime
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'run.json').read_text())
          assert r['run_attempt']==1 and r['id']==int(os.environ['GITHUB_RUN_ID'])
          assert r['event']=='push' and r['head_branch']=='validate-terminal-colors-468-merge-20261106-a2'
          first=json.loads((Path(os.environ['RUNNER_TEMP'])/'first-run.json').read_text())
          assert first['id']==42325805410 and first['run_attempt']==1 and first['conclusion']=='failure' and first['head_sha']=='129e90dad9aaea075b7c61ca427312d6292ea4d0'
          origin=int(datetime.datetime.fromisoformat(first['created_at'].replace('Z','+00:00')).timestamp())
          assert origin==1794015965
          with open(os.environ['GITHUB_OUTPUT'],'a')as f:f.write(f'origin={origin}\n')
          PY
      - name: Full affected Docker validation
        env:
          PACKET_ORIGIN: ${{ steps.anchor.outputs.origin }}
        run: python3 validation/host.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proof
          path: ${{ runner.temp }}/mcpc468/evidence/
          if-no-files-found: error
          retention-days: 7
